[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8
# The allow-list covers the licenses common in the async/web stack the later
# crates use; an entry nothing uses yet is not a problem.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
